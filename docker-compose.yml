services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formistry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formistry}
      POSTGRES_DB: ${POSTGRES_DB:-formistry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formistry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-formistry}:${POSTGRES_PASSWORD:-formistry}@db:5432/${POSTGRES_DB:-formistry}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      AISENSY_API_BASE: ${AISENSY_API_BASE:-https://backend.aisensy.com}
      AISENSY_API_KEY: ${AISENSY_API_KEY}
      AISENSY_SOURCE: ${AISENSY_SOURCE:-rebooking-tool}
      AISENSY_WEBHOOK_TOKEN: ${AISENSY_WEBHOOK_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
